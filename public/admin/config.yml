# Public content only. Authentication is handled by the isolated OAuth Worker.
backend:
  name: github
  repo: mrsnowirbis/veteran-support-ua
  branch: main
  base_url: https://veteran-support-ua-oauth.mr-snowirbis.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo
  open_authoring: true
publish_mode: editorial_workflow
local_backend: false
locale: uk
media_folder: public/uploads
public_folder: /uploads
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: '-'
collections:
  - name: events
    label: Події
    label_singular: Подія
    folder: src/content/events
    media_folder: /public/uploads/events
    public_folder: /uploads/events
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - name: title
        label: Заголовок
        widget: string
        required: true
      - name: description
        label: Короткий опис
        widget: text
        required: true
      - name: date
        label: Дата й час
        widget: datetime
        required: true
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        hint: Час вашого пристрою; на сайті відображається київський час.
      - name: location
        label: Місце
        widget: string
        required: false
      - name: online
        label: Онлайн
        widget: boolean
        default: false
        required: false
      - name: registrationUrl
        label: Посилання на реєстрацію
        widget: string
        required: false
        pattern:
          - ^https://[^\s/?#]+[^\s]*$
          - Вкажіть повну HTTPS-адресу або залиште порожнім.
      - name: image
        label: Зображення
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 2097152
        hint: JPG, PNG або WebP до 2 МБ. Лише публічні матеріали з дозволом на використання.
      - name: imageAlt
        label: Опис обкладинки для доступності
        widget: string
        required: false
        hint: Коротко опишіть фото, без непідтверджених імен або статусів людей.
      - name: draft
        label: Приховати на сайті (чернетка)
        widget: boolean
        default: true
        required: false
        hint: Вимкніть перед передачею на публікацію. Остаточне рішення — за адміністратором.
      - name: demo
        label: Демонстраційний приклад
        widget: boolean
        default: false
        required: false
        hint: Приклади не потрапляють у звичайну production-збірку.
      - name: body
        label: Повний текст
        widget: markdown
        required: false
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        sanitize_preview: true
  - name: stories
    label: Історії
    label_singular: Історія
    folder: src/content/stories
    media_folder: /public/uploads/stories
    public_folder: /uploads/stories
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - name: title
        label: Заголовок
        widget: string
        required: true
      - name: slug
        widget: hidden
        default: ''
        required: false
      - name: excerpt
        label: Короткий вступ
        widget: text
        required: true
      - name: image
        label: Обкладинка
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 2097152
        hint: JPG, PNG або WebP до 2 МБ. Лише публічні матеріали з дозволом на використання.
      - name: publishedDate
        label: Дата публікації
        widget: datetime
        required: true
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        time_format: false
      - name: videos
        label: Відео YouTube
        widget: list
        required: false
        default: []
        summary: '{{fields.url}}'
        hint: Без обкладинки картка використовує прев'ю першого відео. Порядок можна змінити.
        fields:
          - name: url
            label: Посилання YouTube
            widget: string
            required: true
            pattern:
              - ^https://(?:youtu\.be/[A-Za-z0-9_-]{11}/?(?:[?#][^\s]*)?|(?:(?:www\.|m\.)?youtube\.com)/watch\?[^\s]*v=[A-Za-z0-9_-]{11}(?:[&#][^\s]*)?)$
              - Вставте HTTPS-посилання Поділитися або watch з YouTube.
      - name: source
        label: Джерело
        widget: string
        required: false
      - name: externalUrl
        label: URL джерела
        widget: string
        required: false
        pattern:
          - ^https://[^\s/?#]+[^\s]*$
          - Посилання має починатися з https://.
      - name: anonymous
        label: Анонімна історія
        widget: boolean
        default: true
        required: false
      - name: relatedMaterials
        label: Пов’язані матеріали
        widget: relation
        collection: recovery
        search_fields:
          - title
        display_fields:
          - title
        value_field: '{{slug}}'
        multiple: true
        required: false
        default: []
      - name: draft
        label: Приховати на сайті (чернетка)
        widget: boolean
        default: true
        required: false
        hint: Вимкніть перед передачею на публікацію. Остаточне рішення — за адміністратором.
      - name: demo
        label: Демонстраційний приклад
        widget: boolean
        default: false
        required: false
        hint: Приклади не потрапляють у звичайну production-збірку.
      - name: body
        label: Повний текст
        widget: markdown
        required: false
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        sanitize_preview: true
  - name: recovery
    label: Матеріали для відновлення
    label_singular: Матеріал
    folder: src/content/recovery
    media_folder: /public/uploads/recovery
    public_folder: /uploads/recovery
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - name: title
        label: Заголовок
        widget: string
        required: true
      - name: slug
        widget: hidden
        default: ''
        required: false
      - name: description
        label: Короткий опис
        widget: text
        required: true
      - name: category
        label: Категорія
        widget: select
        options:
          - Стабілізаційні вправи
          - Майндфулнес
          - Психологічні рекомендації
          - Психоедукація
          - Творче відновлення
      - name: publishedDate
        label: Дата публікації
        widget: datetime
        required: true
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        time_format: false
      - name: updatedDate
        label: Дата оновлення
        widget: datetime
        required: false
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        time_format: false
      - name: author
        label: Авторство / джерело
        widget: string
        required: true
      - name: externalUrl
        label: Сайт джерела
        widget: string
        required: false
        pattern:
          - ^https://[^\s/?#]+[^\s]*$
          - Вкажіть повну HTTPS-адресу або залиште порожнім.
      - name: image
        label: Обкладинка
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 2097152
        hint: JPG, PNG або WebP до 2 МБ. Лише публічні матеріали з дозволом на використання.
      - name: video
        label: Відео / посилання YouTube
        widget: file
        required: false
        choose_url: true
        media_library:
          config:
            max_file_size: 10485760
        hint: Вставте HTTPS-посилання youtu.be або youtube.com/watch через вибір URL, без коду iframe. Або завантажте публічний файл до 10 МБ з дозволом на використання.
      - name: audio
        label: Аудіо
        widget: file
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 10485760
        hint: Лише публічні медіа до 10 МБ; перевірте права та відсутність приватних даних.
      - name: draft
        label: Приховати на сайті (чернетка)
        widget: boolean
        default: true
        required: false
        hint: Вимкніть перед передачею на публікацію. Остаточне рішення — за адміністратором.
      - name: demo
        label: Демонстраційний приклад
        widget: boolean
        default: false
        required: false
        hint: Приклади не потрапляють у звичайну production-збірку.
      - name: body
        label: Повний текст
        widget: markdown
        required: false
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        sanitize_preview: true
  - name: films
    label: Кінотерапія
    label_singular: Фільм
    folder: src/content/films
    media_folder: /public/uploads/films
    public_folder: /uploads/films
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - name: title
        label: Заголовок
        widget: string
        required: true
      - name: year
        label: Рік
        widget: number
        value_type: int
        required: false
        hint: Лише підтверджений рік. Якщо невідомий — залиште порожнім.
      - name: description
        label: Короткий опис
        widget: text
        required: true
      - name: themes
        label: Теми
        widget: list
        field:
          name: theme
          label: Тема
          widget: string
          required: true
      - name: contentWarning
        label: Попередження про чутливий зміст
        widget: string
        required: false
      - name: studio
        label: Студія
        widget: string
        required: false
      - name: author
        label: Авторство
        widget: string
        required: false
        hint: Підтверджене формулювання, наприклад «Фільм Сергія Волкова».
      - name: participants
        label: Учасники проєкту
        widget: text
        required: false
        hint: Додавайте імена та ролі лише після підтвердження і дозволу на публікацію.
      - name: videos
        label: Серії / відео
        label_singular: Відео
        widget: list
        required: false
        default: []
        summary: '{{fields.url}}'
        fields:
          - name: url
            label: Посилання YouTube
            widget: string
            required: true
            hint: Скопіюйте HTTPS-посилання youtu.be або youtube.com/watch з YouTube. Код плеєра не потрібен.
            pattern:
              - '^https://(?:youtu\.be/[A-Za-z0-9_-]{11}/?(?:[?#][^\s]*)?|(?:www\.|m\.)?youtube\.com/watch\?[^\s]+)$'
              - Вкажіть HTTPS-посилання на окреме відео YouTube.
          - name: title
            label: Назва серії
            widget: string
            required: false
            hint: Якщо не підтверджена — залиште порожнім. На сайті буде «Серія 1», «Серія 2» тощо.
          - name: description
            label: Опис серії
            widget: text
            required: false
      - name: poster
        label: Обкладинка
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 2097152
        hint: JPG, PNG або WebP до 2 МБ. Лише публічні матеріали з дозволом на використання.
      - name: externalUrl
        label: Офіційне посилання
        widget: string
        required: false
        pattern:
          - ^https://[^\s/?#]+[^\s]*$
          - Вкажіть повну HTTPS-адресу або залиште порожнім.
      - name: draft
        label: Приховати на сайті (чернетка)
        widget: boolean
        default: true
        required: false
        hint: Вимкніть перед передачею на публікацію. Остаточне рішення — за адміністратором.
      - name: demo
        label: Демонстраційний приклад
        widget: boolean
        default: false
        required: false
        hint: Приклади не потрапляють у звичайну production-збірку.
      - name: body
        label: Повний текст
        widget: markdown
        required: false
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        sanitize_preview: true
  - name: education
    label: Освіта
    label_singular: Освітня можливість
    folder: src/content/education
    media_folder: /public/uploads/education
    public_folder: /uploads/education
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - name: title
        label: Заголовок
        widget: string
        required: true
      - name: description
        label: Короткий опис
        widget: text
        required: true
      - name: category
        label: Категорія
        widget: select
        options:
          - Навчання
          - Перекваліфікація
          - Курси
          - Програми для ветеранів
          - Гранти та стипендії
          - Працевлаштування
          - Дистанційні професії
      - name: provider
        label: Організатор
        widget: string
        required: false
      - name: externalUrl
        label: Умови участі
        widget: string
        required: false
        pattern:
          - ^https://[^\s/?#]+[^\s]*$
          - Вкажіть повну HTTPS-адресу або залиште порожнім.
      - name: deadline
        label: Кінцевий термін
        widget: datetime
        required: false
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        time_format: false
      - name: publishedDate
        label: Дата публікації
        widget: datetime
        required: true
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        time_format: false
      - name: draft
        label: Приховати на сайті (чернетка)
        widget: boolean
        default: true
        required: false
        hint: Вимкніть перед передачею на публікацію. Остаточне рішення — за адміністратором.
      - name: demo
        label: Демонстраційний приклад
        widget: boolean
        default: false
        required: false
        hint: Приклади не потрапляють у звичайну production-збірку.
      - name: body
        label: Повний текст
        widget: markdown
        required: false
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        sanitize_preview: true
