    fields:
      - name: title
        label: Заголовок
        widget: string
        required: true
      - name: slug
        widget: hidden
        default: ''
        required: false
      - name: description
        label: Короткий опис
        widget: text
        required: true
      - name: category
        label: Категорія
        widget: select
        options:
          - Стабілізаційні вправи
          - Майндфулнес
          - Психологічні рекомендації
          - Психоедукація
      - name: publishedDate
        label: Дата публікації
        widget: datetime
        required: true
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        time_format: false
      - name: updatedDate
        label: Дата оновлення
        widget: datetime
        required: false
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        time_format: false
      - name: author
        label: Автор
        widget: string
        required: true
      - name: image
        label: Зображення
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 2097152
        hint: JPG, PNG або WebP до 2 МБ. Лише публічні матеріали з дозволом на використання.
      - name: video
        label: Відео
        widget: file
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 10485760
        hint: Лише публічні медіа до 10 МБ; перевірте права та відсутність приватних даних.
      - name: audio
        label: Аудіо
        widget: file
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 10485760
        hint: Лише публічні медіа до 10 МБ; перевірте права та відсутність приватних даних.
      - name: draft
        label: Приховати на сайті (чернетка)
        widget: boolean
        default: true
        required: false
        hint: Вимкніть перед передачею на публікацію. Остаточне рішення — за адміністратором.
      - name: demo
        label: Демонстраційний приклад
        widget: boolean
        default: false
        required: false
        hint: Приклади не потрапляють у звичайну production-збірку.
      - name: body
        label: Повний текст
        widget: markdown
        required: false
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        sanitize_preview: true
  - name: films
    label: Кінотерапія
    label_singular: Фільм
    folder: src/content/films
    media_folder: /public/uploads/films
    public_folder: /uploads/films
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - name: title
        label: Заголовок
        widget: string
        required: true
      - name: year
        label: Рік
        widget: number
        value_type: int
      - name: description
        label: Короткий опис
        widget: text
        required: true
      - name: themes
        label: Теми
        widget: list
        field:
          name: theme
          label: Тема
          widget: string
          required: true
      - name: contentWarning
        label: Попередження про чутливий зміст
        widget: string
        required: false
      - name: poster
        label: Постер
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 2097152
        hint: JPG, PNG або WebP до 2 МБ. Лише публічні матеріали з дозволом на використання.
      - name: externalUrl
        label: Офіційне посилання
        widget: string
        required: false
        pattern:
          - ^https://[^\s/?#]+[^\s]*$
          - Вкажіть повну HTTPS-адресу або залиште порожнім.
      - name: draft
        label: Приховати на сайті (чернетка)
        widget: boolean
        default: true
        required: false
        hint: Вимкніть перед передачею на публікацію. Остаточне рішення — за адміністратором.
      - name: demo
        label: Демонстраційний приклад
        widget: boolean
        default: false
        required: false
        hint: Приклади не потрапляють у звичайну production-збірку.
      - name: body
        label: Повний текст
        widget: markdown
        required: false
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        sanitize_preview: true
  - name: education
    label: Освіта
    label_singular: Освітня можливість
    folder: src/content/education
    media_folder: /public/uploads/education
    public_folder: /uploads/education
    create: true
