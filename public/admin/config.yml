# Public content only. Production auth is intentionally disabled until deployment.
backend:
  name: github
  repo: REPLACE_OWNER/REPLACE_REPO
  branch: main
  base_url: https://auth.example.invalid
  auth_endpoint: auth
  auth_scope: public_repo
  open_authoring: true
publish_mode: editorial_workflow
local_backend: false
locale: uk
media_folder: public/uploads
public_folder: /uploads
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: '-'
collections:
  - name: events
    label: Події
    label_singular: Подія
    folder: src/content/events
    media_folder: /public/uploads/events
    public_folder: /uploads/events
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - name: title
        label: Заголовок
        widget: string
        required: true
      - name: description
        label: Короткий опис
        widget: text
        required: true
      - name: date
        label: Дата й час
        widget: datetime
        required: true
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        hint: Час вашого пристрою; на сайті відображається київський час.
      - name: location
        label: Місце
        widget: string
        required: false
      - name: online
        label: Онлайн
        widget: boolean
        default: false
        required: false
      - name: registrationUrl
        label: Посилання на реєстрацію
        widget: string
        required: false
        pattern:
          - ^https://[^\s/?#]+[^\s]*$
          - Вкажіть повну HTTPS-адресу або залиште порожнім.
      - name: image
        label: Зображення
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 2097152
        hint: JPG, PNG або WebP до 2 МБ. Лише публічні матеріали з дозволом на використання.
      - name: draft
        label: Приховати на сайті (чернетка)
        widget: boolean
        default: true
        required: false
        hint: Вимкніть перед передачею на публікацію. Остаточне рішення — за адміністратором.
      - name: demo
        label: Демонстраційний приклад
        widget: boolean
        default: false
        required: false
        hint: Приклади не потрапляють у звичайну production-збірку.
      - name: body
        label: Повний текст
        widget: markdown
        required: false
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        sanitize_preview: true
  - name: stories
    label: Історії
    label_singular: Історія
    folder: src/content/stories
    media_folder: /public/uploads/stories
    public_folder: /uploads/stories
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    editor:
      preview: false
    fields:
      - name: title
        label: Заголовок
        widget: string
        required: true
      - name: slug
        widget: hidden
        default: ''
        required: false
      - name: excerpt
        label: Короткий вступ
        widget: text
        required: true
      - name: image
        label: Зображення
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 2097152
        hint: JPG, PNG або WebP до 2 МБ. Лише публічні матеріали з дозволом на використання.
      - name: publishedDate
        label: Дата публікації
        widget: datetime
        required: true
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        time_format: false
      - name: anonymous
        label: Анонімна історія
        widget: boolean
        default: true
        required: false
      - name: relatedMaterials
        label: Пов’язані матеріали
        widget: relation
        collection: recovery
        search_fields:
          - title
        display_fields:
          - title
        value_field: '{{slug}}'
        multiple: true
        required: false
        default: []
      - name: draft
        label: Приховати на сайті (чернетка)
        widget: boolean
        default: true
        required: false
        hint: Вимкніть перед передачею на публікацію. Остаточне рішення — за адміністратором.
      - name: demo
        label: Демонстраційний приклад
        widget: boolean
        default: false
        required: false
        hint: Приклади не потрапляють у звичайну production-збірку.
      - name: body
        label: Повний текст
        widget: markdown
        required: false
        modes:
          - rich_text
        buttons:
          - bold
          - italic
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - link
        editor_components:
          - image
        sanitize_preview: true
  - name: recovery
    label: Матеріали для відновлення
    label_singular: Матеріал
    folder: src/content/recovery
    media_folder: /public/uploads/recovery
    public_folder: /uploads/recovery
    create: true
