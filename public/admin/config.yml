      - name: deadline
        label: Кінцевий термін
        widget: datetime
        required: false
        format: YYYY-MM-DDTHH:mm:ssZ
        picker_utc: false
        time_format: false
      - name: publishedDate
        label: Дата публікації
        widget: datetime
        required: true
        format: YYYY-MM-DDTHH:mm:ssZ
